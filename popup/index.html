<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Gem Bridge Extension</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="app">
      <h1>Gem Bridge</h1>
      <p class="subtitle">Local-first AI tooling bridge</p>

      <section class="card">
        <h2>Background</h2>
        <p id="background-status">Checking background service...</p>
      </section>

      <section class="card">
        <h2>Native Host</h2>
        <p id="native-status">Checking native client layer...</p>
        <p id="native-host" class="muted"></p>
        <p id="native-message" class="muted"></p>
      </section>

      <section class="card">
        <h2>Current milestone</h2>
        <p>Validate browser extension manifest, popup, background messaging, and native client status.</p>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
